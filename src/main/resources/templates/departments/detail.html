<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head('Departamento')"></head>
<body>
<div th:replace="fragments/common :: header('departamentos')"></div>
<div th:replace="fragments/common :: flash"></div>

<div class="wrap">
    <div class="panel">
        <h2 th:text="'Departamento: ' + ${department.departmentName}">Departamento</h2>
        <div class="body">
            <div class="toolbar">
                <a class="btn btn-link" th:href="@{'/departamentos/' + ${department.departmentId} + '/editar'}">Editar</a>
                <a class="btn btn-link" th:href="@{/departamentos}">Volver</a>
            </div>
            <p>Ubicaci&oacute;n: <b th:text="${department.location}"></b></p>
            <table class="grid">
                <tr><th>#</th><th>Apellidos</th><th>Nombre</th><th>Puesto</th><th class="right">Salario</th></tr>
                <tr th:each="e : ${members}">
                    <td th:text="${e.employeeId}"></td>
                    <td><a th:href="@{'/empleados/' + ${e.employeeId}}" th:text="${e.lastName}"></a></td>
                    <td th:text="${e.firstName}"></td>
                    <td th:text="${e.jobTitle}"></td>
                    <td class="right" th:text="${#numbers.formatDecimal(e.salary,1,'COMMA',2,'POINT')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(members)}"><td colspan="5" class="muted">Sin empleados.</td></tr>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments/common :: footer"></div>
</body>
</html>
