<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head('Ficha de empleado')"></head>
<body>
<div th:replace="fragments/common :: header('empleados')"></div>
<div th:replace="fragments/common :: flash"></div>

<div class="wrap">
    <div class="panel">
        <h2 th:text="'Ficha: ' + ${employee.fullName} + ' (#' + ${employee.employeeId} + ')'">Ficha</h2>
        <div class="body">
            <div class="toolbar">
                <a class="btn btn-link" th:href="@{'/empleados/' + ${employee.employeeId} + '/editar'}">Editar</a>
                <a class="btn btn-link" th:href="@{/empleados}">Volver</a>
            </div>
            <table class="grid" style="width:auto">
                <tr><th>Nombre</th><td th:text="${employee.fullName}"></td></tr>
                <tr><th>Correo</th><td th:text="${employee.email}"></td></tr>
                <tr><th>Puesto</th><td th:text="${employee.jobTitle} + ' (' + ${employee.jobId} + ')'"></td></tr>
                <tr><th>Departamento</th><td th:text="${employee.departmentName}"></td></tr>
                <tr><th>Salario</th><td th:text="${#numbers.formatDecimal(employee.salary,1,'COMMA',2,'POINT')}"></td></tr>
                <tr><th>Fecha de ingreso</th><td th:text="${employee.hireDate}"></td></tr>
                <tr><th>Inicio de asignaci&oacute;n</th><td th:text="${employee.assignmentStartDate}"></td></tr>
                <!-- Normal rendering of stored observations: HTML-escaped (th:text). -->
                <tr><th>Observaciones</th><td th:text="${employee.observations}"></td></tr>
            </table>
        </div>
    </div>

    <div class="panel">
        <h2>Cambios r&aacute;pidos</h2>
        <div class="body">
            <table style="width:100%"><tr>
                <td style="width:33%;vertical-align:top">
                    <form class="dense" method="post" th:action="@{'/empleados/' + ${employee.employeeId} + '/salario'}">
                        <label>Nuevo salario</label><br/>
                        <input type="number" step="0.01" name="salary" th:value="${employee.salary}"/>
                        <input type="submit" value="Cambiar salario"/>
                        <div class="muted">No genera historial.</div>
                    </form>
                </td>
                <td style="width:33%;vertical-align:top">
                    <form class="dense" method="post" th:action="@{'/empleados/' + ${employee.employeeId} + '/asignacion'}">
                        <label>Puesto</label><br/>
                        <input type="text" name="jobId" th:value="${employee.jobId}" size="12"/><br/>
                        <label>Departamento (id)</label><br/>
                        <input type="number" name="departmentId" th:value="${employee.departmentId}"/>
                        <input type="submit" value="Cambiar asignaci&oacute;n"/>
                        <div class="muted">Genera historial (trigger).</div>
                    </form>
                </td>
                <td style="width:34%;vertical-align:top">
                    <form class="dense" method="post" th:action="@{'/empleados/' + ${employee.employeeId} + '/observaciones'}">
                        <label>Observaciones</label><br/>
                        <textarea name="observations" th:text="${employee.observations}"></textarea><br/>
                        <input type="submit" value="Guardar observaciones"/>
                    </form>
                </td>
            </tr></table>
        </div>
    </div>

    <div class="panel">
        <h2>Historial laboral</h2>
        <div class="body">
            <table class="grid">
                <tr><th>Desde</th><th>Hasta</th><th>Puesto</th><th>Departamento</th></tr>
                <tr th:each="h : ${history}">
                    <td th:text="${h.startDate}"></td>
                    <td th:text="${h.endDate}"></td>
                    <td th:text="${h.jobTitle} + ' (' + ${h.jobId} + ')'"></td>
                    <td th:text="${h.departmentName}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(history)}"><td colspan="4" class="muted">Sin movimientos registrados.</td></tr>
            </table>
        </div>
    </div>
</div>

<div th:replace="fragments/common :: footer"></div>
</body>
</html>
