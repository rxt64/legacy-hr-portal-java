<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/common :: head('Editar puesto')"></head>
<body>
<div th:replace="fragments/common :: header('puestos')"></div>

<div class="wrap">
    <div class="panel">
        <h2 th:text="'Editar puesto: ' + ${job.jobId}">Editar puesto</h2>
        <div class="body">
            <form class="dense" method="post" th:action="@{'/puestos/' + ${job.jobId}}" th:object="${job}">
                <table>
                    <tr><td><label>C&oacute;digo</label></td><td th:text="${job.jobId}"></td></tr>
                    <tr><td><label>T&iacute;tulo</label></td><td><input type="text" th:field="*{jobTitle}" size="30"/></td></tr>
                    <tr><td><label>Salario m&iacute;nimo</label></td><td><input type="number" step="0.01" th:field="*{minSalary}"/></td></tr>
                    <tr><td><label>Salario m&aacute;ximo</label></td><td><input type="number" step="0.01" th:field="*{maxSalary}"/></td></tr>
                </table>
                <div class="toolbar" style="margin-top:6px">
                    <input type="submit" value="Guardar"/>
                    <a class="btn btn-link" th:href="@{/puestos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="fragments/common :: footer"></div>
</body>
</html>
